name: בדיקת AI חינמי
on: { workflow_dispatch: {} }
permissions:
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python ai_test.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
