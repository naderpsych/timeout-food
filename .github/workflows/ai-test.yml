name: בדיקת AI חינמי
on: { workflow_dispatch: {} }
permissions:
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: מה הפעולה הרשמית מציעה
        continue-on-error: true
        uses: actions/ai-inference@v1
        id: ai
        with:
          prompt: 'בכתבת אוכל הוזכר "ויטרינה". בגוגל נמצא "Vitrina" באבן גבירול 36 תל אביב. אותו מקום? ענה כן או לא.'
      - name: תוצאה
        continue-on-error: true
        run: echo "תשובת המודל = ${{ steps.ai.outputs.response }}"
      - name: נקודת קצה 2 (models.github.ai)
        continue-on-error: true
        run: python ai_test.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_ENDPOINT: https://models.github.ai/inference/chat/completions
          AI_MODEL: openai/gpt-4o-mini
