name: סוכן גוגל מפות

on:
  schedule:
    # כל 6 שעות — משלים שעות וכתובות למקומות שחסר להם מידע
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "כמה מקומות למלא בריצה"
        default: "150"

permissions:
  contents: write

concurrency:
  group: google-agent
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת תלויות
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: הרצת הסוכן
        run: python google_agent.py ${{ github.event.inputs.batch || '150' }}

      - name: שמירת עדכונים
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "אין מידע חדש"
          else
            git commit -m "סוכן גוגל: השלמת שעות וכתובות ($(date -u +%Y-%m-%d\ %H:%M))"
            git pull --rebase --autostash
            git push
          fi
