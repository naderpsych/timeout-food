name: סוכן גוגל מפות

on:
  schedule:
    # כל 6 שעות — משלים שעות וכתובות למקומות שחסר להם מידע
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      batch:
        description: "כמה מקומות למלא בריצה"
        default: "350"

permissions:
  contents: write

concurrency:
  group: google-agent
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת תלויות
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: הרצת הסוכן
        run: python google_agent.py ${{ github.event.inputs.batch || '350' }}

      - name: שמירת עדכונים
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # מחילים את התוצאות על הגרסה העדכנית ביותר, כדי שלא תהיה התנגשות
          # גם אם data.json התעדכן בזמן שהסוכן רץ.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout origin/main -- docs/data.json
            python apply_patch.py
            git add docs/data.json
            if git diff --cached --quiet; then
              echo "אין מידע חדש"; break
            fi
            git commit -m "סוכן גוגל: השלמת שעות וכתובות ($(date -u +%Y-%m-%d\ %H:%M))"
            if git push; then
              echo "נשמר בהצלחה"; break
            fi
            echo "דחיפה נכשלה (ניסיון $attempt) — מנסים שוב על הגרסה החדשה"
            git reset --hard origin/main
          done
