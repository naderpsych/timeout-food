name: סריקת המלצות אוכל

on:
  schedule:
    # פעם ביום ב-03:30 UTC (06:30 בקיץ / 05:30 בחורף שעון ישראל)
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת תלויות
        run: pip install -r requirements.txt

      - name: הרצת הסורק
        run: python scraper.py

      - name: שמירת עדכונים
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "אין כרטיסים חדשים"
          else
            git commit -m "עדכון אוטומטי: כרטיסים חדשים ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: התרעה על תקלה
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BODY_TAIL: |
            אם זה חוזר — ייתכן ש-TimeOut שינו את ההגנה ויש לבדוק את שרשרת המזהים.
        with:
          script: |
            const title = "⚠️ סריקת TimeOut נכשלה";
            const when = new Date().toISOString().slice(0, 16);
            const body = ["הסריקה האוטומטית נכשלה ב-" + when + ".", "", "[צפייה בפרטי הריצה](" + process.env.RUN_URL + ")", "", process.env.BODY_TAIL].join(String.fromCharCode(10));
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "scrape-failure" });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["scrape-failure"] });
            }
